# Giao diện của ứng dụng (Streamlit đọc file này khi chạy trong thư mục app/)
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
borderColor = "#e2e8f0"
font = "sans serif"

[theme.sidebar]                  # thanh bên tối (xanh đậm) để tách hẳn khỏi phần nội dung sáng
backgroundColor = "#0f1e46"
secondaryBackgroundColor = "#1b2f63"
textColor = "#e2e8f0"
primaryColor = "#3b82f6"
borderColor = "#2c4380"
codeBackgroundColor = "#1b2f63"

[client]
toolbarMode = "minimal"     # ẩn nút Deploy và menu dành cho lập trình viên
